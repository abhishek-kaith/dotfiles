### WINDOWS AND WORKSPACES ###

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

windowrulev2 = opacity 0.0 override, class:^(xwaylandvideobridge)$
windowrulev2 = noanim, class:^(xwaylandvideobridge)$
windowrulev2 = noinitialfocus, class:^(xwaylandvideobridge)$
windowrulev2 = maxsize 1 1, class:^(xwaylandvideobridge)$
windowrulev2 = noblur, class:^(xwaylandvideobridge)$
windowrulev2 = nofocus, class:^(xwaylandvideobridge)$

### PICTURE-IN-PICTURE ###
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = size 20% 20%, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = move onscreen 100%-w-10 100%-w-10, title:^(Picture-in-Picture)$

### BLUETOOTH ###
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = size 30% 60%, class:^(blueman-manager)$
windowrulev2 = pin, class:^(blueman-manager)$

### VOLUME CONTROL ###
windowrulev2 = float, class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = size 30% 60%, class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = pin, class:^(org.pulseaudio.pavucontrol)$

### FILE MANAGER ###
windowrulev2 = float, class:^(org.gnome.Nautilus)$
windowrulev2 = size 50% 50%, class:^(org.gnome.Nautilus)$

### WAYDROID ###
windowrulev2 = float,class:^(Waydroid)
windowrulev2 = move onscreen 100%-w-10 10%, class:^(Waydroid)$

### OPACITY ###
windowrulev2 = opacity 0.95 0.95,class:^(Thorium-browser)$
windowrulev2 = opacity 0.95 0.95,class:^(zen)$
windowrulev2 = opacity 0.95 0.95,class:^(com.mitchellh.ghostty)$
windowrulev2 = opacity 0.90 0.90,class:^(Code)$
windowrulev2 = opacity 0.90 0.90,class:^(code-url-handler)$
windowrulev2 = opacity 0.90 0.90,class:^(code-insiders-url-handler)$
windowrulev2 = opacity 0.90 0.90,class:^(org.gnome.Nautilus)$
windowrulev2 = opacity 0.90 0.90,class:^(org.kde.ark)$
windowrulev2 = opacity 0.90 0.90,class:^(nwg-look)$
windowrulev2 = opacity 0.90 0.90,class:^(qt5ct)$
windowrulev2 = opacity 0.90 0.90,class:^(qt6ct)$
windowrulev2 = opacity 0.90 0.90,class:^(kvantummanager)$
windowrulev2 = opacity 0.90 0.90,class:^(pavucontrol)$
windowrulev2 = opacity 0.90 0.90,class:^(blueman-manager)$
windowrulev2 = opacity 0.90 0.90,class:^(nm-applet)$
